<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRP-GO -Xe yêu thích của tôi </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header Đầu Trang -->
    <header class="header">
        <div class="header-logo">
            <span class="logo-name">VRP - <span>Go</span></span>
        </div>

        <div class="header-right">
            <button class="bell-btn" title="Thông báo">
                <i class="fa-solid fa-bell"></i>
            </button>
            <div class="user-profile">
                <div class="user-avatar">VU</div>
                <span class="user-name">Vu Duc</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <!-- Khung Nội Dung Chính -->
    <div class="main-container">

        <!-- Sidebar Điều Hướng -->
        <aside class="sidebar">
            <div class="sidebar-label">TÀI KHOẢN CỦA TÔI</div>
            <a href="#" class="sidebar-item">
                <i class="fa-solid fa-user"></i> Hồ sơ của tôi
            </a>
            <a href="#" class="sidebar-item">
                <i class="fa-solid fa-file-invoice"></i> Đơn thuê của tôi
            </a>
            <a href="#" class="sidebar-item active">
                <i class="fa-solid fa-heart"></i> Danh sách yêu thích
            </a>
            <a href="#" class="sidebar-item">
                <i class="fa-solid fa-star-half-stroke"></i> Đánh giá của tôi
            </a>
        </aside>

        <!-- Phần Nội Dung Trọng Tâm -->
        <main class="content">
            <div class="greeting-box">
                <h1>Xin chào bạn!</h1>
                <p>Quản lý danh sách phương tiện bạn đã lưu và quan tâm.</p>
            </div>

            <div class="card-box">
                <h2>Xe yêu thích của tôi</h2>

                <!-- Các Tab Chuyển Đổi -->
                <div class="tabs">
                    <button onclick="switchTab('xe-may')" id="tab-xe-may" class="tab-btn active">
                        Xe máy (<span id="count-xe-may">0</span>)
                    </button>
                    <button onclick="switchTab('o-to')" id="tab-o-to" class="tab-btn">
                        Xe ô tô (<span id="count-o-to">0</span>)
                    </button>
                </div>

                <!-- Danh sách xe (Được render tự động bằng JS) -->
                <div id="cars-container" class="car-list"></div>
            </div>
        </main>
    </div>

    <!-- Thông báo nổi (Toast) -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Thành công!</span>
    </div>

    <script src="script.js"></script>
</body>

</html>
